[versions]
# --- Build toolchain ---
# Kept in lockstep with OwnTV_Core and the TV app: all three compile the same core sources through a
# composite build during local development, and Gradle cannot mix two AGP/Kotlin versions there.
agp = "9.4.0"
kotlin = "2.4.20"

# --- AndroidX / Jetpack ---
coreKtx = "1.19.0"
splashscreen = "1.2.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
# Window size classes / adaptive layouts — a phone-and-tablet concern the TV app has no use for, and
# the one dependency here that the TV catalog does not carry. Versioned separately from the BOM.
adaptive = "1.3.0"
lifecycle = "2.11.0"
navigationCompose = "2.10.1"
work = "2.11.2"

# --- Paging ---
paging = "3.5.1"
# Correct squircle maths for the Aurora glass. Hand-rolled continuous curvature looks wrong at
# small radii, and this is the supported implementation of it.
graphicsShapes = "1.1.0"

# --- Kotlin libs ---
coroutines = "1.11.0"

# --- Third party ---
coil = "3.6.2"
# Media3 — only the subtitle view. The player itself is core's; this app draws the image
# subtitles (PGS/VOBSUB/DVB) the engine hands to ExoPlayer, and nothing else from media3.
media3 = "1.11.1"
koin = "4.2.2"
# Google Cast. Phone-only, and deliberately absent from the TV app's catalogue and from core: an
# Android TV box IS the receiver, so a sender SDK there would be an app casting to itself.
playServicesCast = "22.3.1"
# The route button and the device chooser the Cast SDK drives. Declared explicitly rather than taken
# transitively, because MediaRouteButton is constructed by name in CastRouteButton.kt.
mediarouter = "1.8.1"

# CameraX, for one screen only: reading the QR code the television shows when pairing for local
# sync. Phone-only by nature — a television has no camera, so it shows the code and never reads one.
camerax = "1.6.2"
# The decoder itself is zxing, which core already carries for GENERATING these codes. Same library,
# other direction; no ML Kit, no Play-services dependency, nothing extra to ship.
zxing = "3.5.4"

# --- Test ---
junit = "4.13.2"
junitExt = "1.3.0"
espressoCore = "3.7.0"

# Macrobenchmark and the baseline-profile Gradle plugin. The plugin's version is the benchmark
# library's — they ship together and must not be split. Same versions as the TV app.
# Stable, deliberately: this was left on 1.5.0-rc02 after the final release came out, and a release
# candidate is not what an app's own release should be built with.
benchmark = "1.5.0"
uiautomator = "2.4.0"

# --- OwnTV core library (https://github.com/ahXN00/OwnTV_Core) ---
# Both artifacts always ship on the same version; never split them. Bumping this is how the mobile
# app takes a core change, and core's release workflow opens that bump as a PR automatically. For
# local work, owntv.corePath in ~/.gradle/gradle.properties substitutes core's source for these
# artifacts and this number is then ignored.
owntvCore = "1.0.61"

# libmpv is deliberately NOT declared here. `:player-core` exposes it as `api`, so it reaches this
# app's compile classpath with core — which it must, because OwnTVPlayer implements
# MPVLib.EventObserver. Core's catalog owns the version, and one owner is the point: two hosts each
# naming their own would be two copies of a native library and a packaging conflict.

[libraries]
# The shared engine, from its own repository. Everything below the UI — database, sync, EPG, backup,
# settings, strings — comes from here; this repo adds the phone/tablet shell only.
owntv-core = { group = "tv.own.owntv", name = "core", version.ref = "owntvCore" }
owntv-player-core = { group = "tv.own.owntv", name = "player-core", version.ref = "owntvCore" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

# Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose (versions managed by the BOM)
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
# The stock glyphs are gone: every icon in this app is drawn by MobileIcon.kt, on the same 24x24 grid
# as the television's set, so the two apps look like one product. Nothing here needs material-icons.
# Material 3 for touch. The TV app's androidx.tv:tv-material has NO place in this repo: its
# components assume a focus-driven, ten-foot UI. If a screen seems to need it, it is TV code.
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive", version.ref = "adaptive" }
androidx-graphics-shapes = { group = "androidx.graphics", name = "graphics-shapes", version.ref = "graphicsShapes" }

# Lifecycle / Navigation
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# WorkManager — core's sync/EPG workers are WorkManager workers, and core's manifest removes the
# default initializer, so this app must supply the Configuration itself.
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }

# Paging — core's DAOs return PagingSource for the big catalogs (170k+ movies).
androidx-paging-runtime = { group = "androidx.paging", name = "paging-runtime", version.ref = "paging" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Image loading
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Dependency injection
koin-bom = { group = "io.insert-koin", name = "koin-bom", version.ref = "koin" }
koin-android = { group = "io.insert-koin", name = "koin-android" }
koin-androidx-compose = { group = "io.insert-koin", name = "koin-androidx-compose" }

# Casting
play-services-cast-framework = { group = "com.google.android.gms", name = "play-services-cast-framework", version.ref = "playServicesCast" }
androidx-mediarouter = { group = "androidx.mediarouter", name = "mediarouter", version.ref = "mediarouter" }

# QR scanning for local sync pairing
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
